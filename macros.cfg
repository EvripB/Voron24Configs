[gcode_macro PRINT_START]
#   Main slicer start macro. The TradRack Orca profile supplies MESH_MODE=ORCA
#   and explicit mesh geometry; callers that omit it retain Klipper adaptive meshing.
gcode:
    {% set skip_prime = params.SKIP_PRIME|default(0)|int %}               ; 1 means PRIME_LINE will be called later, after loading the initial tool.
    {% set mesh_mode = params.MESH_MODE|default("KLIPPER")|upper %}       ; Choose Orca-supplied bounds or Klipper's original adaptive mode.
    {% set mesh_min = params.MESH_MIN|default("") %}                      ; Lower-left X,Y probing bound calculated by Orca.
    {% set mesh_max = params.MESH_MAX|default("") %}                      ; Upper-right X,Y probing bound calculated by Orca.
    {% set probe_count = params.PROBE_COUNT|default("") %}                ; Number of X,Y probe points calculated by Orca.
    {% set mesh_algorithm = params.MESH_ALGORITHM|default("")|lower %}    ; Orca's lagrange or bicubic interpolation method.

    {% if mesh_mode not in ["KLIPPER", "ORCA"] %}                                   ; Accept only the two supported mesh modes.
        {action_raise_error("PRINT_START MESH_MODE must be KLIPPER or ORCA")}       ; Stop before motion if the mode is invalid.
    {% endif %}                                                                     ; End mesh-mode validation.

    {% if mesh_mode == "ORCA" %}       ; Validate the extra values required by Orca mode.
        {% if not mesh_min or not mesh_max or not probe_count or not mesh_algorithm %}     ; Check that every required value was supplied.
            {action_raise_error("PRINT_START MESH_MODE=ORCA requires MESH_MIN, MESH_MAX, PROBE_COUNT, and MESH_ALGORITHM")}    ; Stop before motion if a value is missing.
        {% elif mesh_algorithm not in ["lagrange", "bicubic"] %}                           ; Accept only Klipper-supported algorithms.
            {action_raise_error("PRINT_START MESH_ALGORITHM must be lagrange or bicubic")}                                     ; Stop before motion if it is invalid.
        {% endif %}                                                                        ; End Orca-value validation.
    {% endif %}                        ; End the Orca-only validation block.

    G32                            ; Home the machine, apply QGL when needed, and return the toolhead to a known position.
    M117 Bed Meshing               ; Show the current start-up stage on the printer display.
    STATUS_MESHING                 ; Set the toolhead LEDs to the configured meshing status.
    SAY S="Creating bed mesh"      ; Announce the meshing stage through Talking Voron.

    {% if mesh_mode == "ORCA" %}        ; Use Orca's complete first-layer region, including the prime tower.
        BED_MESH_CALIBRATE PROFILE=adaptive_orca MESH_MIN={mesh_min} MESH_MAX={mesh_max} PROBE_COUNT={probe_count} ALGORITHM={mesh_algorithm} ADAPTIVE=0 ADAPTIVE_MARGIN=0 ; Probe Orca's explicit region without applying Klipper adaptation or a second margin.
    {% else %}                          ; Keep the original behavior for all other PRINT_START calls.
        BED_MESH_CALIBRATE ADAPTIVE=1 ; Let Klipper derive the mesh from its defined print objects.
    {% endif %}                         ; End bed-meshing method selection.

    G1 Z20 F3000                        ; Move the nozzle safely up to Z20 after probing.
    {% if not skip_prime %}             ; Prime here unless Orca requested the later prime.
        PRIME_LINE                      ; Fill the nozzle and print the configured bed-prime line.
    {% endif %}                         ; End optional in-macro priming.
    M117 {printer.print_stats.filename} ; Show the current G-code filename on the printer display.

#   Play Musing
    M300 S1319 P30                 ; Play the first note of the short print-start sound.
    M300 S1760 P30                 ; Play the second note of the short print-start sound.
    M300 S2349 P70                 ; Play the final note of the short print-start sound.
    TEMP_MONITOR_START             ; Start the custom heater-temperature warning monitor.
    SAY S="Print is starting"      ; Announce through Talking Voron that normal printing is about to begin.

[gcode_macro PRINT_END]
#   Use PRINT_END for the slicer ending script - please customise for your slicer of choice
gcode:
    M400                           ; wait for buffer to clear
    G92 E0                         ; zero the extruder
    G1 E-10.0 F3600                ; retract filament
    G91                            ; relative positioning
    G0 Z1.00 X20.0 Y20.0 F20000    ; move nozzle to remove stringing
    TEMP_MONITOR_STOP
    TURN_OFF_HEATERS
    M107                           ; turn off fan
    G1 Z2 F3000                    ; move nozzle up 2mm
    G90                            ; absolute positioning
    G0  X125 Y250 F3600            ; park nozzle at rear
    #BED_MESH_CLEAR
    M300 S1319 P70
    M300 S1568 P90
    G4 P80
    M300 S1319 P70
    M300 S988  P140
    SAY S="Print completed"

[gcode_macro PRIME_LINE]
gcode: 
    M117 Prime Line                         ; display prime-line status
    SAVE_GCODE_STATE NAME=prime_line_state  ; save the slicer's current positioning and extrusion modes
    G90                                     ; use absolute positioning for all nozzle movements
    M83                                     ; use relative extrusion for predictable purge amounts
    G0 Z5 F3000                             ; ensure the nozzle is safely above the bed before travelling
    G0 X250 Y5 F9000                        ; move above the prime-line starting position
    G0 Z0.28 F1500                          ; lower the nozzle to first-layer height
    G1 E10 F300                             ; extrude at the start position to refill the empty nozzle and create an anchor
    G4 P500                                 ; pause briefly so the starting purge can settle and stick to the bed
    G1 X160 E25 F1200                       ; heavily purge during the first half to refill an empty nozzle quickly
    G1 X70 E12 F1200                        ; finish the first line at a lower flow rate, for E37 total extrusion
    G1 E2.5 F300                            ; extrude a smaller anchor at the end of the first line
    G4 P500                                 ; pause briefly so the ending purge can settle before the return line
    G1 Y5.7 E0.10 F600                      ; shift sideways while maintaining filament flow
    G1 X160 E5.4 F1500                      ; print the second line halfway back beside the well-primed part of the first line
    G1 X175 F1500                           ; coast without extrusion to release residual nozzle pressure
    G1 X180 E-0.7 F1800                     ; retract while moving along the end of the coast tail
    G1 X170 Z1.0 F3000                      ; lift diagonally to tear the remaining strand from the nozzle
    G1 Z5 F3000                             ; raise the nozzle to a safe travel height
    RESTORE_GCODE_STATE NAME=prime_line_state ; restore the slicer's original positioning and extrusion modes

[gcode_macro G32]
gcode:
    {% if printer.toolhead.homed_axes != "xyz" %}
        #{action_respond_info("printer not home. Homing...")}
        M117 Homing
        SAY S="Homing toolhead"
        STATUS_HOMING
        G28
    {% endif %}

    {% if printer.quad_gantry_level.applied == 0 %}
        #{action_respond_info("printer not QGL. QGLing...")}
        M117 Quad Gantly Leveling
        SAY S="Executing Quad Gantry Leveling"
        STATUS_LEVELING
        QUAD_GANTRY_LEVEL
    {% endif %}

#    5/2/2026 commented everything BED_MESH-related out to switch to ADAPTIVE. If no object is about to be printed, adaptive bed mesh can't work so BED_MESH_CALIBRATE has been moved to PRINT_START
#    {% if printer.bed_mesh.profile_name == '' %}
#        #{action_respond_info("no bed mesh loaded. Performing BED_MESH_CALIBRATE")}
#        BED_MESH_CALIBRATE ADAPTIVE=1 #added "ADAPTIVE=1" to use Adaptive Bed Mesh option of Klipper
#    {% endif %}

    #G28
    ##	Uncomment for for your size printer:
    #--------------------------------------------------------------------
    ##	Uncomment for 250mm build
    #G0 X125 Y125 Z30 F3600
    
    ##	Uncomment for 300 build
    G90                            ; Go to absolute mode, otherwise printer tries to move X to 359 (209 from z-endstop + 150 from the below movement meant to move the printhead to the center. Same for Y)
    G28
    G0 X150 Y150 Z20 F3600
    
    ##	Uncomment for 350mm build
    #G0 X175 Y175 Z30 F3600
    #--------------------------------------------------------------------

[gcode_macro ForceG32]
gcode:
    STATUS_HOMING
    G28
    STATUS_LEVELING
    QUAD_GANTRY_LEVEL
    STATUS_MESHING
    BED_MESH_CLEAR
    BED_MESH_CALIBRATE

[gcode_macro SERVICE]
gcode:
    G90                      ; absolute positioning
    G0 X235 Y20 Z35 F3600    ; move to X235 Y20 Z35

[gcode_macro PrimeNozzle]
gcode:
    M83
    G1 E40 F600
    G1 E-5 F600
    G1 E40 F600
    G1 E-5 F600
    G1 E40 F600
    G1 E-5 F600
    G1 E40 F600
    G1 E-5 F600
    G1 E40 F600
    G1 E-5 F600


[gcode_macro LUBE_RAILS]
description: Continuous diagonal moves where X,Y,Z all move every segment (CoreXY + Z rails)
# Usage example:
#   LUBE_RAILS REPEATS=5 SPEED=120 Z_MIN=20 Z_MAX=200 MARGIN=5 ACCEL=6000 ACCEL_TO_DECEL=3000
gcode:
    # -------- Parameters (with defaults) --------
    {% set speed   = params.SPEED|default(120)|float %}
    {% set repeats = params.REPEATS|default(1)|int %}
    {% set zmin    = params.Z_MIN|default(20)|float %}
    {% set zmax    = params.Z_MAX|default(200)|float %}
    {% set margin  = params.MARGIN|default(5)|float %}
    {% set accel   = params.ACCEL|default(6000)|float %}
    {% set a2d     = params.ACCEL_TO_DECEL|default(3000)|float %}

    # -------- Derived values --------
    {% set xmin = margin %}
    {% set ymin = margin %}
    {% set xmax = printer.toolhead.axis_maximum.x - margin %}
    {% set ymax = printer.toolhead.axis_maximum.y - margin %}
    {% set f_xyz = speed * 60 %}

    M400
    G90

    # Home if needed
    {% if printer.toolhead.homed_axes != "xyz" %}
        G28
    {% endif %}

    # Basic sanity clamps (optional but recommended)
    {% if repeats < 1 %}
        {action_raise_error("REPEATS must be >= 1")}
    {% endif %}
    {% if zmax <= zmin %}
        {action_raise_error("Z_MAX must be > Z_MIN")}
    {% endif %}
    {% if xmax <= xmin or ymax <= ymin %}
        {action_raise_error("MARGIN too large for bed size")}
    {% endif %}

    # Move to start
    G1 X{xmin} Y{ymin} Z{zmin} F{f_xyz}

    # Set motion limits
    SET_VELOCITY_LIMIT VELOCITY={speed} ACCEL={accel} ACCEL_TO_DECEL={a2d}

    # Pattern
    {% for i in range(repeats) %}
        G1 X{xmax} Y{ymax} Z{zmax} F{f_xyz}
        G1 X{xmin} Y{ymin} Z{zmin} F{f_xyz}

        G1 X{xmin} Y{ymax} Z{zmax} F{f_xyz}
        G1 X{xmax} Y{ymin} Z{zmin} F{f_xyz}
    {% endfor %}

    # Park
    G1 X{(xmax + xmin)/2} Y{(ymax + ymin)/2} Z{zmin} F{f_xyz}
    M400

[gcode_macro TEST_BELTS]
gcode:
  {% if 'x' not in printer.toolhead.homed_axes %}
  {% if 'y' not in printer.toolhead.homed_axes %}
  G28 X Y 
  {% endif %}
  {% endif %}
 
  {% set circles = params.S|default(1)|int %}
  {% set rate = params.F|default(18000)|int %}
  {% for i in range(circles) %}
      G1 X{printer.toolhead.axis_minimum.x + 15} Y{printer.toolhead.axis_minimum.y + 15}  F{rate}
      G1 X{printer.toolhead.axis_maximum.x - 15} Y{printer.toolhead.axis_minimum.y + 15}  F{rate}
      G1 X{printer.toolhead.axis_maximum.x - 15} Y{printer.toolhead.axis_maximum.y - 15} F{rate}
      G1 X{printer.toolhead.axis_minimum.x + 15} Y{printer.toolhead.axis_maximum.y - 15}  F{rate}
      G1 X{printer.toolhead.axis_minimum.x + 15} Y{printer.toolhead.axis_minimum.y + 15}  F{rate}
    {% endfor %}
    G1 X{ printer.toolhead.axis_maximum.x / 2  } Y{printer.toolhead.axis_maximum.y  /2}  F{rate}

[gcode_macro TEMP_MONITOR_START]
description: Start monitoring hotend temperature
variable_enabled: 0
gcode:
    SET_GCODE_VARIABLE MACRO=TEMP_MONITOR_START VARIABLE=enabled VALUE=1
    UPDATE_DELAYED_GCODE ID=temp_watchdog DURATION=5

[gcode_macro TEMP_MONITOR_STOP]
description: Stop monitoring hotend temperature
gcode:
    SET_GCODE_VARIABLE MACRO=TEMP_MONITOR_START VARIABLE=enabled VALUE=0
    UPDATE_DELAYED_GCODE ID=temp_watchdog DURATION=0

[delayed_gcode temp_watchdog]
gcode:
    {% set enabled = printer["gcode_macro TEMP_MONITOR_START"].enabled|int %}
    {% set default_volume = printer["gcode_macro AUDIO_SETTINGS"].default_volume|int %}
    {% set target = printer.extruder.target|float %}
    {% set actual = printer.extruder.temperature|float %}
    {% set threshold = 3 %}

    {% if enabled %}
        {% if target > 0 and (target - actual) >= threshold %}
            M300 S2000 P150
            M300 S1200 P150
            M300 S2000 P150
            M300 S1200 P150
            M300 S2000 P150
            M300 S1200 P150
            M300 S2000 P150
            M300 S1200 P150
            M300 S2000 P150
            M300 S1200 P150
            G4 P1500
            RUN_SHELL_COMMAND CMD=SETVOLUME PARAMS=100
            SAY S="warning! warning! Hotend temperature too low!"
            RUN_SHELL_COMMAND CMD=SETVOLUME PARAMS={default_volume}
        {% endif %}

        UPDATE_DELAYED_GCODE ID=temp_watchdog DURATION=5
    {% endif %}

[gcode_macro SAY]
gcode:
    {% set s = params.S|default("") %}
    {% if s == "" %}
        {action_respond_info('Usage: SAY S="your text here"')}
    {% else %}
        RUN_SHELL_COMMAND CMD=RUNSAY PARAMS="{s}"
    {% endif %}

[gcode_shell_command RUNSAY]
command: /home/pi/talking_voron/say.sh
timeout: 30.0
verbose: True

[gcode_macro AUDIO_SETTINGS]
description: Show the default Raspberry Pi audio volume
variable_default_volume: 85
gcode:
    {action_respond_info("Default audio volume: %d%%" % printer["gcode_macro AUDIO_SETTINGS"].default_volume|int)}

[gcode_macro SET_VOLUME]
description: Set Raspberry Pi audio volume
gcode:
    {% set default_volume = printer["gcode_macro AUDIO_SETTINGS"].default_volume|int %}
    {% set volume = params.VOLUME|default(default_volume)|int %}
    {% set silent = params.SILENT|default(0)|int %}

    {% if volume < 0 or volume > 100 %}
        {action_respond_info("Volume must be between 0 and 100")}
    {% else %}
        RUN_SHELL_COMMAND CMD=SETVOLUME PARAMS={volume}
        G4 P300
        {% if silent == 0 %}
            SAY S="Volume set to {volume} percent"
        {% endif %}
    {% endif %}


[gcode_shell_command SETVOLUME]
command: /bin/bash -c '/usr/bin/amixer set PCM "$1%" >/dev/null 2>&1' dummy
timeout: 5.
verbose: False

[gcode_macro REQUIRE_TRADRACK]
description: Stop a TradRack print when Happy Hare is disabled
gcode:
    {% if not printer.mmu.enabled %}
        SAY S="Trad Rack is disabled. Clear the alternate feeder, enable the M M U, verify its state, then restart the print."
        _TRADRACK_DISABLED_ERROR
    {% endif %}

[gcode_macro MMU_DISABLE]
description: Disable Happy Hare for printing from the alternate filament feeder
gcode:
    MMU ENABLE=0    ; Disable Happy Hare and release control of the TradRack.

[gcode_macro MMU_HOME_SAFE]
description: Home the TradRack only when filament is confirmed unloaded
gcode:
    {% set tool = params.TOOL|default(0)|int %}
    {% if printer.mmu.filament_pos == 0 %}
        MMU_HOME TOOL={tool} FORCE_UNLOAD=0
    {% else %}
        {action_respond_info("MMU home blocked: filament is not confirmed unloaded (filament_pos=%d)." % printer.mmu.filament_pos)}
    {% endif %}

[gcode_macro _CROSSBOW_SAFE_APPROACH]
description: Route to the front-left Crossbow cutter without crossing behind its depressor
variable_clearance_x: 20.0
gcode:
    {% set cut_vars = printer["gcode_macro _MMU_CUT_TIP_VARS"] %}
    {% set _, pin_y = cut_vars.pin_loc_xy|map("float") %}
    {% set park_y = pin_y + (cut_vars.pin_park_dist|float) %}
    {% set clearance_x = printer["gcode_macro _CROSSBOW_SAFE_APPROACH"].clearance_x|float %}
    {% set travel_feedrate = (cut_vars.travel_speed|float) * 60 %}
    {% set cutting_axis = cut_vars.cutting_axis|string|lower %}
    {% set xy_homed = "x" in printer.toolhead.homed_axes and "y" in printer.toolhead.homed_axes %}
    {% set current_x = printer.gcode_move.gcode_position.x|float %}

    {% if cutting_axis != "y" %}
        {action_raise_error("_CROSSBOW_SAFE_APPROACH requires the cutter to use the Y axis.")}
    {% endif %}
    {% if not xy_homed %}
        {action_raise_error("_CROSSBOW_SAFE_APPROACH requires XY to be homed before unloading.")}
    {% endif %}

    SAVE_GCODE_STATE NAME=crossbow_safe_approach_state    ; Preserve the caller's positioning and extrusion modes.
    G90                                                   ; Use absolute coordinates for the collision-avoidance route.

    {% if current_x <= clearance_x %}
        G1 X{clearance_x} F{travel_feedrate}              ; Clear the depressor laterally before making any Y movement.
        G1 Y{park_y} F{travel_feedrate}                   ; Approach Y15 only after reaching the safe X clearance.
    {% else %}
        G1 X{clearance_x} Y{park_y} F{travel_feedrate}    ; Approach X20 Y15 diagonally while remaining right of the depressor.
    {% endif %}

    RESTORE_GCODE_STATE NAME=crossbow_safe_approach_state ; Restore modes without moving away from the safe approach position.

[gcode_macro _TRADRACK_DISABLED_ERROR]
description: Raise the TradRack-disabled error after speaking it
gcode:
    {action_raise_error("TradRack is disabled. Clear the alternate feeder, enable MMU, verify its state, then restart the print.")}
